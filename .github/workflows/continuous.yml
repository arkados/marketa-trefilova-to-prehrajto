name: continuous-upload
on:
  workflow_dispatch:
    inputs:
      automatic:
        description: "Started by upload recovery"
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  upload:
    if: vars.AUTOMATION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.automatic)
    uses: ./.github/workflows/sync.yml
    with:
      mode: continuous
      limit: 3
      workers: 3
    secrets: inherit
  resume:
    needs: upload
    if: ${{ !cancelled() && needs.upload.result != 'skipped' && github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Queue the next upload run
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$UPLOAD_RESULT" == failure ]]; then
            echo "The uploader failed; waiting three minutes before checking for a successor"
            sleep 180
          fi
          # An older run may still be finishing its own recovery job.
          # Only a newer active run can take over from this one.
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow continuous.yml --branch main \
            --limit 30 --json number,status \
            --jq "[.[] | select(.number > $GITHUB_RUN_NUMBER and .status != \"completed\")] | length")
          if [[ "$active" -gt 0 ]]; then
            echo "A successor is already active or queued"
            exit 0
          fi
          gh workflow run continuous.yml --repo "$GITHUB_REPOSITORY" --ref main -f automatic=true
